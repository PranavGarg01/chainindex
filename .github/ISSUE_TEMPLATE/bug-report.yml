name: Report an app bug
description: Report a reproducible problem with the chainindex website
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a failed RPC endpoint, use the dedicated broken RPC form instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://www.chainindex.dev/...
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on macOS 15
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or logs after removing sensitive information.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
